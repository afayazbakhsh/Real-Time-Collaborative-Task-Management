version: "3.9"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            - APP_ENV=${APP_ENV}
        container_name: app
        restart: unless-stopped
        tty: true
        volumes:
            - ./:/var/www:delegated
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        depends_on:
            - db
        networks:
            - app-network

    webserver:
        image: nginx:1.23.3-alpine
        container_name: webserver
        restart: unless-stopped
        tty: true
        ports:
            - "${APP_PORT}:80"
        volumes:
            - ./:/var/www:delegated
            - ./docker/nginx/conf.d/dev/:/etc/nginx/conf.d/
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
        networks:
            - app-network

    db:
        image: postgres:13
        container_name: db
        restart: unless-stopped
        tty: true
        ports:
            - "${DB_PORT}:5432"
        environment:
            POSTGRES_DB: "${DB_DATABASE}"
            POSTGRES_USER: "${DB_USERNAME}"
            POSTGRES_PASSWORD: "${DB_PASSWORD}"
            POSTGRES_INITDB_ARGS: "--max-connections=200"
        volumes:
            - ./docker/pgsql/data:/var/lib/postgresql/data
        networks:
            - app-network

    adminer:
        image: adminer
        container_name: adminer
        restart: unless-stopped
        tty: true
        ports:
            - "${FORWARD_PHPMYADMIN_PORT:-9191}:8080"
        depends_on:
            - db
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    pgsql_data:
        driver: local
